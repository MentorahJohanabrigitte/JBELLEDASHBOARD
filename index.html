<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBELLE DASHBOARD | Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0B8DA6; --accent: #B8848B; --bg: #F6E9E2; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #F6E9E2 0%, #E8D5CC 100%); color: #0F172A; height: 100vh; overflow: hidden; }
        #app { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #0B8DA6; color: white; padding: 2.5rem 1.5rem; flex-shrink: 0; }
        .nav-item { padding: 1rem; margin-bottom: 0.5rem; border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.2); }
        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        .glass-card { background: white; border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { padding: 12px; color: #94A3B8; font-size: 0.75rem; text-transform: uppercase; text-align: left; }
        td { padding: 15px; background: #F8FAFC; }
        td:first-child { border-radius: 12px 0 0 12px; }
        td:last-child { border-radius: 0 12px 12px 0; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-body { background: white; width: 95%; max-width: 600px; padding: 2.5rem; border-radius: 30px; }
        .view { display: none; }
        .view.active { display: block; }
        .btn-p { background: #0B8DA6; color: white; padding: 10px 20px; border-radius: 12px; font-weight: 700; }
        .input-b { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div id="app">
    <aside class="sidebar">
        <h1 class="text-3xl font-black mb-1">J'Belle</h1>
        <p class="text-[10px] opacity-70 mb-10 tracking-widest uppercase">Panel de Administración</p>
        <nav>
            <div class="nav-item active" onclick="showV('dash')">Dashboard</div>
            <div class="nav-item" onclick="showV('ventas')">Ventas</div>
            <div class="nav-item" onclick="showV('inv')">Inventario</div>
            <div class="nav-item" onclick="showV('fin')">Reportes Financieros</div>
        </nav>
    </aside>

    <main class="main-content">
        <div id="v-ventas" class="view">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-[#0B8DA6]">Ventas Realizadas</h2>
                <button class="btn-p" onclick="openM('modal-venta')">+ Nueva Venta</button>
            </div>
            <div class="glass-card">
                <table id="t-sales"><thead><tr><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody id="b-sales"></tbody></table>
            </div>
        </div>

        <div id="v-inv" class="view">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-[#0B8DA6]">Inventario de Productos</h2>
                <button class="btn-p" onclick="openM('modal-prod')">+ Nuevo Producto</button>
            </div>
            <div class="glass-card">
                <table id="t-inv">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Estilo</th>
                            <th>Sucursal</th>
                            <th>Stock</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody id="b-inv"></tbody>
                </table>
            </div>
        </div>

        <div id="v-dash" class="view active"><h2 class="text-2xl font-bold mb-6 text-[#0B8DA6]">Resumen</h2><div id="dash-stats" class="grid grid-cols-3 gap-4 mb-8"></div></div>
        <div id="v-fin" class="view"><h2 class="text-2xl font-bold mb-6 text-[#0B8DA6]">Finanzas</h2><div class="glass-card"><table id="t-fin"><thead><tr><th>Fecha</th><th>Cliente</th><th>Neto</th></tr></thead><tbody id="b-fin"></tbody></table></div></div>
    </main>
</div>

<div class="modal-overlay" id="modal-prod">
    <div class="modal-body">
        <h2 class="text-2xl font-black mb-6 text-[#0B8DA6]">Agregar Producto</h2>
        <form id="f-prod" onsubmit="saveProduct(event)">
            <input type="text" id="p-name" placeholder="Nombre del Producto" class="input-b" required>
            <input type="text" id="p-style" placeholder="Estilo (Ej: Natural, Volumen)" class="input-b" required>
            <input type="text" id="p-suc" placeholder="Sucursal (Ej: Tegucigalpa)" class="input-b" required>
            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="p-stock" placeholder="Stock Inicial" class="input-b" required>
                <input type="number" id="p-price" placeholder="Precio (L)" class="input-b" required>
            </div>
            <div class="flex gap-4 mt-4">
                <button type="button" class="flex-1 p-3 bg-gray-100 rounded-xl font-bold" onclick="closeM('modal-prod')">Cancelar</button>
                <button type="submit" class="flex-1 btn-p" id="btn-p-save">Guardar Producto</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API = "https://sheetdb.io/api/v1/pfye2lgmsymzk";
    let sales = [], products = [];

    async function load() {
        const [v, p] = await Promise.all([fetch(`${API}?sheet=ventas`), fetch(`${API}?sheet=productos`)]);
        sales = await v.json(); products = await p.json();
        render();
    }

    function render() {
        // Render Inventario con los 5 campos solicitados
        document.getElementById('b-inv').innerHTML = products.map(p => `
            <tr>
                <td><b>${p.nombre}</b></td>
                <td><span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-md">${p.estilo || '-'}</span></td>
                <td>${p.sucursal}</td>
                <td class="${p.stock < 5 ? 'text-red-500 font-bold' : ''}">${p.stock}</td>
                <td class="font-black">L ${p.precio}</td>
            </tr>
        `).join('');

        // Render Ventas
        document.getElementById('b-sales').innerHTML = sales.map(s => `
            <tr><td>${s.fecha}</td><td><b>${s.cliente}</b></td><td>L ${s.total}</td><td>${s.estado}</td></tr>
        `).reverse().join('');
    }

    async function saveProduct(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-p-save'); btn.disabled = true;
        const newP = {
            nombre: document.getElementById('p-name').value,
            estilo: document.getElementById('p-style').value,
            sucursal: document.getElementById('p-suc').value,
            stock: document.getElementById('p-stock').value,
            precio: document.getElementById('p-price').value
        };
        const res = await fetch(`${API}?sheet=productos`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ data: [newP] })
        });
        if(res.ok) { closeM('modal-prod'); load(); }
        btn.disabled = false;
    }

    function showV(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('v-' + id).classList.add('active');
    }
    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM(id) { document.getElementById(id).classList.remove('active'); }
    window.onload = load;
</script>
</body>
</html>
